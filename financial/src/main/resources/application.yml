spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: financial
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:financial}
    username: ${POSTGRES_USER:financial}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}

refresh-token:
  days: ${REFRESH_TOKEN_DAYS:30}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:financial-photos}
  pj-bucket: ${MINIO_PJ_BUCKET:financial-pj-files}

brapi:
  base-url: ${BRAPI_BASE_URL:https://brapi.dev}
  token: ${BRAPI_TOKEN:}
  timeout-seconds: ${BRAPI_TIMEOUT_SECONDS:3}

market-price:
  ttl-hours: ${MARKET_PRICE_TTL_HOURS:24}

features:
  investments-enabled: ${FEATURES_INVESTMENTS_ENABLED:true}

gmail:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost/api/gmail/callback}
  token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
  auth-endpoint: https://accounts.google.com/o/oauth2/v2/auth
  token-endpoint: https://oauth2.googleapis.com/token
  revoke-endpoint: https://oauth2.googleapis.com/revoke
  userinfo-endpoint: https://openidconnect.googleapis.com/v1/userinfo

tts:
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    voice-id: ${ELEVENLABS_VOICE_ID:}
    model-id: ${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
    endpoint: https://api.elevenlabs.io/v1/text-to-speech

logging:
  level:
    com.financial: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
