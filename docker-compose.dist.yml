# Docker Compose para uso final (sem build).
# Puxa as imagens publicadas no GitHub Container Registry.
#
# Como usar:
#   1. Coloque este arquivo numa pasta vazia
#   2. Baixe .env.example e renomeie como .env (ou crie o seu próprio)
#      https://raw.githubusercontent.com/diegos1255/financial/master/financial/.env.example
#   3. Edite o .env: troque pelo menos POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD e JWT_SECRET
#   4. docker-compose up -d
#   5. Acesse http://localhost
#
# Para atualizar quando houver versão nova:
#   docker-compose pull && docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - financial-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: financial-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - financial-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: financial-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set public local/${MINIO_BUCKET} &&
      mc mb --ignore-existing local/${MINIO_PJ_BUCKET:-financial-pj-files} &&
      echo 'Buckets prontos.'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PJ_BUCKET: ${MINIO_PJ_BUCKET:-financial-pj-files}

  redis:
    image: redis:7-alpine
    container_name: financial-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    image: ghcr.io/diegos1255/financial-backend:latest
    container_name: financial-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      SERVER_PORT: 8080
      SQL_INIT_MODE: always
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PJ_BUCKET: ${MINIO_PJ_BUCKET:-financial-pj-files}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      FEATURES_INVESTMENTS_ENABLED: ${FEATURES_INVESTMENTS_ENABLED:-true}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost/api/gmail/callback}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    image: ghcr.io/diegos1255/financial-frontend:latest
    container_name: financial-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  financial-postgres-data:
  financial-minio-data:
